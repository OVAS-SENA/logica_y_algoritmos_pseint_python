<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Mapa de síntesis conceptual de la Guía 03: de la lógica proposicional a la aplicación modular con archivos">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7FAF7"/>
      <stop offset="100%" stop-color="#EAF3EC"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39A900"/>
      <stop offset="100%" stop-color="#007832"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00304D"/>
      <stop offset="100%" stop-color="#005080"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#007832"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00304D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="url(#bgGrad)" stroke="#D5E3D8" stroke-width="2"/>
  <rect x="0" y="0" width="960" height="52" rx="16" fill="url(#blueGrad)"/>
  <rect x="0" y="34" width="960" height="18" fill="url(#blueGrad)"/>
  <text x="480" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">
    ARQUITECTURA ALGORÍTMICA INTEGRAL · GUÍA 03 (RAP 592376-03)
  </text>

  <!-- Fila 1: Etapas 1 a 4 -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="200" height="106" rx="12" fill="#FFFFFF" stroke="#39A900" stroke-width="2"/>
    <rect x="30" y="80" width="200" height="28" rx="12" fill="url(#greenGrad)"/>
    <rect x="30" y="96" width="200" height="12" fill="url(#greenGrad)"/>
    <text x="130" y="99" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">1. LÓGICA Y OPERADORES</text>
    <text x="130" y="128" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Proposiciones · Tablas de verdad</text>
    <text x="130" y="146" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Jerarquía de operadores (8 niveles)</text>
    <text x="130" y="170" text-anchor="middle" fill="#007832" font-family="Consolas, monospace" font-size="11" font-weight="700">AA1-EV01 · CR1</text>
  </g>

  <line x1="230" y1="133" x2="262" y2="133" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="266" y="80" width="200" height="106" rx="12" fill="#FFFFFF" stroke="#39A900" stroke-width="2"/>
    <rect x="266" y="80" width="200" height="28" rx="12" fill="url(#greenGrad)"/>
    <rect x="266" y="96" width="200" height="12" fill="url(#greenGrad)"/>
    <text x="366" y="99" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">2. EPS Y CONDICIONALES</text>
    <text x="366" y="128" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Entrada · Proceso · Salida</text>
    <text x="366" y="146" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Diagramas de flujo · Si / Según / elif</text>
    <text x="366" y="170" text-anchor="middle" fill="#007832" font-family="Consolas, monospace" font-size="11" font-weight="700">AA2-EV01 · CR2</text>
  </g>

  <line x1="466" y1="133" x2="498" y2="133" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="502" y="80" width="200" height="106" rx="12" fill="#FFFFFF" stroke="#39A900" stroke-width="2"/>
    <rect x="502" y="80" width="200" height="28" rx="12" fill="url(#greenGrad)"/>
    <rect x="502" y="96" width="200" height="12" fill="url(#greenGrad)"/>
    <text x="602" y="99" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">3. CICLOS Y TRAZA</text>
    <text x="602" y="128" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Para · Mientras · Repetir</text>
    <text x="602" y="146" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Contadores, acumuladores y banderas</text>
    <text x="602" y="170" text-anchor="middle" fill="#007832" font-family="Consolas, monospace" font-size="11" font-weight="700">AA2-EV02 · CR2</text>
  </g>

  <line x1="702" y1="133" x2="734" y2="133" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="738" y="80" width="192" height="106" rx="12" fill="#FFFFFF" stroke="#39A900" stroke-width="2"/>
    <rect x="738" y="80" width="192" height="28" rx="12" fill="url(#greenGrad)"/>
    <rect x="738" y="96" width="192" height="12" fill="url(#greenGrad)"/>
    <text x="834" y="99" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">4. MODULARIDAD</text>
    <text x="834" y="128" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Funciones y SubProcesos</text>
    <text x="834" y="146" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Valor vs Referencia · docstrings</text>
    <text x="834" y="170" text-anchor="middle" fill="#007832" font-family="Consolas, monospace" font-size="11" font-weight="700">AA2-EV03 · CR3</text>
  </g>

  <!-- Conector entre filas -->
  <path d="M 834 186 L 834 212 L 130 212 L 130 232" fill="none" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Fila 2: Etapas 5 a 7 -->
  <g filter="url(#shadow)">
    <rect x="30" y="236" width="230" height="114" rx="12" fill="#FFFFFF" stroke="#00304D" stroke-width="2"/>
    <rect x="30" y="236" width="230" height="28" rx="12" fill="url(#blueGrad)"/>
    <rect x="30" y="252" width="230" height="12" fill="url(#blueGrad)"/>
    <text x="145" y="255" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">5. ARREGLOS 1D Y 2D</text>
    <text x="145" y="284" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Vectores paralelos · Matrices</text>
    <text x="145" y="302" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Búsqueda · Burbuja · Índice 1 vs 0</text>
    <text x="145" y="330" text-anchor="middle" fill="#00304D" font-family="Consolas, monospace" font-size="11" font-weight="700">AA2-EV04 · CR4</text>
  </g>

  <line x1="260" y1="293" x2="294" y2="293" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="298" y="236" width="230" height="114" rx="12" fill="#FFFFFF" stroke="#00304D" stroke-width="2"/>
    <rect x="298" y="236" width="230" height="28" rx="12" fill="url(#blueGrad)"/>
    <rect x="298" y="252" width="230" height="12" fill="url(#blueGrad)"/>
    <text x="413" y="255" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">6. ARCHIVOS TXT Y CSV</text>
    <text x="413" y="284" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Persistencia CRUD (r, w, a)</text>
    <text x="413" y="302" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">with open() · csv · try/except</text>
    <text x="413" y="330" text-anchor="middle" fill="#00304D" font-family="Consolas, monospace" font-size="11" font-weight="700">AA2-EV05 · CR5</text>
  </g>

  <line x1="528" y1="293" x2="562" y2="293" stroke="#007832" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="566" y="230" width="364" height="126" rx="14" fill="#FFFDF5" stroke="#FDC300" stroke-width="3"/>
    <rect x="566" y="230" width="364" height="32" rx="14" fill="#007832"/>
    <rect x="566" y="248" width="364" height="14" fill="#007832"/>
    <text x="748" y="251" text-anchor="middle" fill="#FDC300" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">7. RETO INTEGRADOR Y EVALUACIÓN</text>
    <text x="748" y="284" text-anchor="middle" fill="#1C241B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">App Consola: Menú + ≥5 Funciones + Matriz + CSV</text>
    <text x="748" y="305" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">PSeInt (Diseño) → Prueba de escritorio → Python (Verificación)</text>
    <text x="748" y="324" text-anchor="middle" fill="#4A5568" font-family="Segoe UI, sans-serif" font-size="11">Sustentación en vivo + Cuestionario de 6 bloques</text>
    <text x="748" y="344" text-anchor="middle" fill="#007832" font-family="Consolas, monospace" font-size="11" font-weight="700">AA3-EV01 &amp; AA3-EV02 · CR1–CR5</text>
  </g>

  <!-- Barra inferior metodológica -->
  <rect x="30" y="376" width="900" height="44" rx="10" fill="#E6F0F7" stroke="#B9D2E6" stroke-width="1.5"/>
  <text x="480" y="403" text-anchor="middle" fill="#00304D" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">
    RUTA DE CADA SOLUCIÓN: [1] Analizar (EPS) → [2] Diseñar (PSeInt + diagrama) → [3] Probar a mano (traza) → [4] Codificar (Python) → [5] Verificar (casos)
  </text>
</svg>
