<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" rx="16" fill="#F6F6F6" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="920" height="68" rx="16" fill="#00304D"/>
  <rect x="0" y="48" width="920" height="20" fill="#00304D"/>
  <rect x="0" y="64" width="920" height="4" fill="#39A900"/>
  <text x="28" y="33" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Unidad 6 · Persistencia en archivos CSV y control de excepciones</text>
  <text x="28" y="54" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#50E5F9">Flujo seguro RAM ↔ Disco con with open(), operaciones CRUD y try / except</text>
  <rect x="24" y="88" width="224" height="160" rx="10" fill="#E6F0F7" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="24" y="88" width="224" height="32" rx="10" fill="#00304D"/>
  <rect x="24" y="108" width="224" height="12" fill="#00304D"/>
  <text x="36" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">RAM (Volátil)</text>
  <text x="36" y="142" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">clientes = [...]</text>
  <text x="36" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">Se pierde al cerrar.</text>
  <text x="36" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">En PSeInt se simula</text>
  <text x="36" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">con vectores paralelos.</text>
  <line x1="257" y1="168" x2="283" y2="168" stroke="#007832" stroke-width="2.5"/>
  <polygon points="290,168 283,163 283,173" fill="#007832"/>
  <polygon points="250,168 257,163 257,173" fill="#00304D"/>
  <rect x="292" y="88" width="336" height="160" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="292" y="88" width="336" height="32" rx="10" fill="#007832"/>
  <rect x="292" y="108" width="336" height="12" fill="#007832"/>
  <text x="304" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Administrador with open()</text>
  <text x="304" y="142" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">"r" → Leer (si falta: FileNotFoundError)</text>
  <text x="304" y="162" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#9A3412">"w" → Sobreescribir (Editar / Eliminar)</text>
  <text x="304" y="182" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">"a" → Agregar registro al final</text>
  <text x="304" y="202" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#71277A">newline="", encoding="utf-8"</text>
  <line x1="630" y1="168" x2="663" y2="168" stroke="#007832" stroke-width="2.5"/>
  <polygon points="670,168 663,163 663,173" fill="#007832"/>
  <rect x="672" y="88" width="224" height="160" rx="10" fill="#EEF8EB" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="672" y="88" width="224" height="32" rx="10" fill="#71277A"/>
  <rect x="672" y="108" width="224" height="12" fill="#71277A"/>
  <text x="684" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Archivo clientes.csv</text>
  <text x="684" y="142" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">doc,nombre,telefono</text>
  <text x="684" y="162" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#141A15">1004,Laura,3100000000</text>
  <text x="684" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">Persiste tras cerrar</text>
  <text x="684" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">y reiniciar la app.</text>
  <rect x="24" y="266" width="424" height="134" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="24" y="266" width="424" height="32" rx="10" fill="#00304D"/>
  <rect x="24" y="286" width="424" height="12" fill="#00304D"/>
  <text x="36" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Operaciones CRUD completas</text>
  <text x="36" y="320" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">C Crear · R Consultar · U Modificar · D Eliminar</text>
  <text x="36" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">Antes de modificar o eliminar: cargar lista,</text>
  <text x="36" y="360" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">actualizar y reescribir con "w" + csv.DictWriter.</text>
  <rect x="472" y="266" width="424" height="134" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="472" y="266" width="424" height="32" rx="10" fill="#71277A"/>
  <rect x="472" y="286" width="424" height="12" fill="#71277A"/>
  <text x="484" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Escudo try / except (cero caídas)</text>
  <text x="484" y="320" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#71277A">except FileNotFoundError: → retorna []</text>
  <text x="484" y="340" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#9A3412">except ValueError: → pide dato válido</text>
  <text x="484" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#141A15">Evita que el programa aborte por errores del usuario.</text>
</svg>