<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" rx="16" fill="#F6F6F6" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="920" height="68" rx="16" fill="#00304D"/>
  <rect x="0" y="48" width="920" height="20" fill="#00304D"/>
  <rect x="0" y="64" width="920" height="4" fill="#39A900"/>
  <text x="28" y="33" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Unidad 2 · Modelo EPS y estructuras condicionales</text>
  <text x="28" y="54" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#50E5F9">Descomposición Entrada-Proceso-Salida y selección de rutas en PSeInt y Python</text>
  <rect x="24" y="88" width="270" height="108" rx="10" fill="#E6F0F7" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="24" y="88" width="270" height="32" rx="10" fill="#00304D"/>
  <rect x="24" y="108" width="270" height="12" fill="#00304D"/>
  <text x="36" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Entrada (Leer / input)</text>
  <text x="36" y="142" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">Leer monto, carnet</text>
  <text x="36" y="162" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">monto = float(input())</text>
  <line x1="296" y1="142" x2="315" y2="142" stroke="#007832" stroke-width="2.5"/>
  <polygon points="322,142 315,137 315,147" fill="#007832"/>
  <rect x="324" y="88" width="272" height="108" rx="10" fill="#EEF8EB" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="324" y="88" width="272" height="32" rx="10" fill="#007832"/>
  <rect x="324" y="108" width="272" height="12" fill="#007832"/>
  <text x="336" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Proceso (Transformación)</text>
  <text x="336" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#71277A">Evalúa reglas con Si/Según</text>
  <text x="336" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#71277A">Calcula descuento y neto</text>
  <line x1="598" y1="142" x2="617" y2="142" stroke="#007832" stroke-width="2.5"/>
  <polygon points="624,142 617,137 617,147" fill="#007832"/>
  <rect x="626" y="88" width="270" height="108" rx="10" fill="#FFFBE6" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="626" y="88" width="270" height="32" rx="10" fill="#71277A"/>
  <rect x="626" y="108" width="270" height="12" fill="#71277A"/>
  <text x="638" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Salida (Escribir / print)</text>
  <text x="638" y="142" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">Escribir "Total: $", neto</text>
  <text x="638" y="162" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">print(f"Total: ${neto}")</text>
  <rect x="24" y="218" width="280" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="24" y="218" width="280" height="32" rx="10" fill="#00304D"/>
  <rect x="24" y="238" width="280" height="12" fill="#00304D"/>
  <text x="36" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Condicional simple y doble</text>
  <text x="36" y="272" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">Si cond Entonces ... SiNo ... FinSi</text>
  <text x="36" y="292" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">if cond:</text>
  <text x="36" y="312" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#475569">    # rama verdadera</text>
  <text x="36" y="332" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">else:</text>
  <text x="36" y="352" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#475569">    # rama falsa</text>
  <rect x="320" y="218" width="280" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="320" y="218" width="280" height="32" rx="10" fill="#007832"/>
  <rect x="320" y="238" width="280" height="12" fill="#007832"/>
  <text x="332" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Anidada / Encadenada (elif)</text>
  <text x="332" y="272" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">Si sub &gt;= 300000 -&gt; 10%</text>
  <text x="332" y="292" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">SiNo Si sub &gt;= 100000 -&gt; 5%</text>
  <text x="332" y="312" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">SiNo -&gt; 0%</text>
  <text x="332" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#141A15">Python usa elif sin anidar de más.</text>
  <text x="332" y="352" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#9A3412">Evitar resultados .5 en round()</text>
  <rect x="616" y="218" width="280" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="616" y="218" width="280" height="32" rx="10" fill="#71277A"/>
  <rect x="616" y="238" width="280" height="12" fill="#71277A"/>
  <text x="628" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Múltiple (Según → if/elif)</text>
  <text x="628" y="272" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#71277A">Segun op Hacer</text>
  <text x="628" y="292" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">  1: recargo = 0</text>
  <text x="628" y="312" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">  2: recargo = sub * 0.03</text>
  <text x="628" y="332" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#00304D">  De Otro Modo: ...</text>
  <text x="628" y="352" font-family="Cascadia Mono, Consolas, monospace" font-size="12" font-weight="bold" fill="#007832">En Python: if op==1 ... elif ...</text>
</svg>